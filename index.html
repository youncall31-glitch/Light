<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마지막 등대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one letterboxed portrait stage (400x760 world units). Canvas paints the night world; a DOM HUD floats above it. */
:root{
  --ink:#060912; --panel:#0e1221; --panel2:#151a2c; --line:rgba(236,229,212,.14);
  --lamp:#ffc46b; --ember:#ff7a3d; --spirit:#8fe6ff; --violet:#c3a8ff; --bone:#ece5d4; --mute:#8f8daa; --danger:#ff5d6c;
  --f-disp:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 100%,#0c1530 0%,var(--ink) 62%)}
#stage{position:relative;font-size:calc(var(--u,1)*14px);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.7)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#ui button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.pe{pointer-events:auto}

/* HUD */
#hud{position:absolute;top:.65em;left:.65em;right:.65em;display:flex;gap:.4em;align-items:center}
.chip{display:flex;align-items:center;gap:.42em;padding:.32em .7em .32em .55em;background:rgba(7,9,18,.66);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:700;font-variant-numeric:tabular-nums;font-size:.95em;line-height:1.2}
.chip small{font-size:.7em;color:var(--mute);font-weight:500;letter-spacing:.06em}
.chip i{width:.55em;height:.55em;border-radius:50%;background:var(--c);box-shadow:0 0 .7em var(--c);flex:none}
.chip.hurt{animation:hurt .35s}
@keyframes hurt{30%{background:rgba(255,93,108,.45);border-color:var(--danger)}}
#hud .sp{flex:1}
#combo{position:absolute;top:3.1em;right:.75em;font-family:var(--f-disp);font-weight:700;color:var(--lamp);text-shadow:0 0 .8em rgba(255,196,107,.7);font-size:1.15em;opacity:0;transition:opacity .25s;font-variant-numeric:tabular-nums}
#combo.on{opacity:1}

#bossbar{position:absolute;top:3em;left:50%;transform:translateX(-50%);width:62%;text-align:center}
#bossbar b{display:block;font-family:var(--f-disp);font-size:.92em;letter-spacing:.04em;color:#ffb3ba;text-shadow:0 0 .8em rgba(255,80,100,.6);margin-bottom:.25em}
#bossbar div{height:.42em;border-radius:1em;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,93,108,.35)}
#bossbar div span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1630,#ff5d6c);box-shadow:0 0 .8em #ff5d6c;transition:width .15s}

/* Bottom controls */
#bar{position:absolute;left:.7em;right:.7em;bottom:.75em;display:flex;align-items:flex-end;gap:.45em}
.ib{width:2.7em;height:2.7em;border-radius:.85em;background:rgba(7,9,18,.7);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.92em;padding:0}
.ib svg{width:1.15em;height:1.15em}
.ib.off{color:var(--mute)}
#flash{margin-left:auto;width:4.7em;height:4.7em;border-radius:50%;padding:.26em;border:none;background:conic-gradient(var(--lamp) calc(var(--p,1)*1turn),rgba(255,255,255,.1) 0)}
#flash span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#4a3712,#120d06 75%);font-family:var(--f-disp);font-weight:700;color:var(--lamp);font-size:1.02em;line-height:1.05}
#flash span small{display:block;font-family:var(--f-ui);font-size:.62em;color:var(--mute);font-weight:500}
#flash.ready span{animation:ready 1.6s ease-in-out infinite}
#flash:disabled{filter:saturate(.4) brightness(.8)}
@keyframes ready{50%{box-shadow:0 0 1.4em rgba(255,196,107,.55) inset,0 0 1.2em rgba(255,196,107,.5)}}

#next{position:absolute;left:50%;bottom:1em;transform:translateX(-50%);border:none;border-radius:1em;padding:.7em 1.3em .6em;background:linear-gradient(180deg,#ffd58c,#e79b3b);color:#1b1105!important;font-weight:700;box-shadow:0 0 0 1px rgba(255,220,160,.6),0 .4em 1.6em rgba(255,170,60,.45);text-align:center;line-height:1.2;white-space:nowrap}
#next small{display:block;font-size:.72em;font-weight:600;opacity:.75}
#hint{position:absolute;left:50%;bottom:12em;transform:translateX(-50%);font-family:var(--f-disp);font-size:.86em;line-height:1.5;color:var(--lamp);padding:.45em .9em;border-radius:.8em;background:rgba(6,8,18,.72);border:1px solid rgba(255,196,107,.3);text-align:center;width:max-content;max-width:86%;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}

/* Floating text */
#banner{position:absolute;left:0;right:0;top:3.3em;text-align:center;opacity:0;transform:translateY(-.4em);transition:opacity .4s,transform .4s}
#banner.on{opacity:1;transform:none}
#banner b{display:block;font-family:var(--f-disp);font-weight:700;font-size:1.45em;letter-spacing:.08em;color:var(--bone);text-shadow:0 0 1.2em rgba(255,196,107,.55),0 .1em .6em rgba(0,0,0,.9)}
#banner span{display:block;margin-top:.15em;font-size:.68em;letter-spacing:.24em;color:var(--lamp)}
#banner.boss b{color:#ffc2c8;text-shadow:0 0 1.2em rgba(255,70,90,.8),0 .1em .6em #000}
#banner.boss span{color:#ff8a96}
#story{position:absolute;left:4%;right:4%;bottom:6.2em;text-align:center;font-family:var(--f-disp);font-size:.84em;line-height:1.55;color:#e9e2cf;padding:.55em .9em;border-radius:.8em;background:linear-gradient(180deg,rgba(6,8,18,.5),rgba(6,8,18,.78));border:1px solid rgba(255,196,107,.16);opacity:0;transition:opacity 1s;text-wrap:balance}
#story.on{opacity:1}
#toast{position:absolute;left:50%;top:5.7em;transform:translateX(-50%);display:flex;flex-direction:column;gap:.3em;align-items:center;width:92%}
.t{padding:.35em .75em;border-radius:.6em;background:rgba(8,10,20,.68);border:1px solid var(--line);font-size:.74em;font-weight:600;text-align:center;line-height:1.45;max-width:100%;animation:tin .3s ease-out,tout .45s ease-in forwards 2.3s}
.t.syn{border-color:rgba(195,168,255,.7);color:#e6dcff;box-shadow:0 0 1.4em rgba(195,168,255,.35)}
.t.gold{border-color:rgba(255,196,107,.55);color:#ffe2ac}
.t.who{font-family:var(--f-disp);font-weight:400;color:#e8e1cd}
@keyframes tin{from{opacity:0;transform:translateY(-.4em)}}
@keyframes tout{to{opacity:0;transform:translateY(-.4em)}}

/* Build / tower popover */
#pop{position:absolute;width:15.5em;padding:.6em;background:rgba(12,15,28,.94);border:1px solid rgba(255,196,107,.28);border-radius:.9em;box-shadow:0 1em 2.4em rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pop .pt{font-family:var(--f-disp);font-weight:700;font-size:.95em;margin:0 .15em .45em;display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
#pop .pt small{font-family:var(--f-ui);font-weight:500;font-size:.72em;color:var(--mute)}
#pop .pg{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.opt{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.45em;align-items:center;text-align:left;padding:.45em .5em;border-radius:.65em;background:var(--panel2);border:1px solid var(--line)}
.opt i{grid-row:span 2;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:.85em;color:#0b0d16;background:radial-gradient(circle at 40% 35%,#fff,var(--c) 55%);box-shadow:0 0 .8em var(--c)}
.opt b{font-size:.86em;line-height:1.2}
.opt span{font-size:.68em;color:var(--mute);line-height:1.25}
.opt em{grid-column:2;font-style:normal;font-weight:700;font-size:.78em;color:var(--lamp);font-variant-numeric:tabular-nums}
.opt:disabled{opacity:.4}
.row{display:flex;gap:.4em;margin-top:.15em}
.row button{flex:1;padding:.55em .4em;border-radius:.6em;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:.82em}
.row .up{background:linear-gradient(180deg,#ffd58c,#e79b3b);color:#1b1105!important;border:none}
.row .up:disabled{background:var(--panel2);color:var(--mute)!important;border:1px solid var(--line)}
.stats{font-size:.74em;color:#c9c3b3;margin:0 .2em .55em;font-variant-numeric:tabular-nums;line-height:1.5}
.stats em{font-style:normal;color:var(--mute)}

/* Overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;padding:1.4em 1.2em;background:rgba(4,6,14,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto;text-align:center;overflow-y:auto}
.ov h2{margin:0;font-family:var(--f-disp);font-size:1.75em;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.ov p{margin:0;color:#cfc8b6;line-height:1.6;font-size:.92em;max-width:22em;text-wrap:balance}
.eyebrow{font-size:.72em;letter-spacing:.28em;color:var(--lamp);font-weight:600}
.btn{border-radius:.85em;padding:.8em 1.3em;border:1px solid rgba(236,229,212,.22);background:rgba(20,24,42,.85);font-weight:700;min-width:12em}
.btn.pri{background:linear-gradient(180deg,#ffd58c,#e79b3b);color:#1b1105!important;border:none;box-shadow:0 .4em 1.8em rgba(255,170,60,.45);font-size:1.08em}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)!important;min-width:0;padding:.5em}
.btns{display:flex;flex-direction:column;gap:.55em;align-items:center}

#title{background:linear-gradient(180deg,rgba(4,6,14,.82) 0%,rgba(4,6,14,.35) 45%,rgba(4,6,14,0) 70%);justify-content:flex-start;padding-top:12%;backdrop-filter:none;-webkit-backdrop-filter:none}
#title h1{margin:.1em 0 0;font-family:var(--f-disp);font-weight:700;font-size:3.1em;letter-spacing:.08em;line-height:1.1;background:linear-gradient(180deg,#fff4dc,#ffc46b 70%,#c47a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 .5em rgba(255,180,80,.35))}
#title .tag{font-family:var(--f-disp);color:#d9d2bf;font-size:.98em;margin-top:-.1em}
#title .btns{margin-top:1.4em}
#title .rec{font-size:.78em;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:.3em}

#cards{gap:1em}
#cards .cl{display:flex;gap:.55em;width:100%;justify-content:center}
.card{flex:1;max-width:9.2em;min-width:0;border-radius:1em;padding:.9em .6em .8em;background:linear-gradient(180deg,#171c31,#0d1020);border:1px solid var(--rc);box-shadow:0 0 1.6em var(--rg),inset 0 0 0 1px rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;gap:.45em;text-align:center;animation:deal .5s cubic-bezier(.2,.9,.3,1.2) both;position:relative;overflow:hidden}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes deal{from{opacity:0;transform:translateY(1.5em) rotateY(70deg) scale(.9)}}
.card .rr{font-size:.62em;letter-spacing:.2em;color:var(--rc);font-weight:700}
.card .gl{width:2.8em;height:2.8em;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;color:#0b0d16;background:radial-gradient(circle at 40% 35%,#fff,var(--c) 58%);box-shadow:0 0 1.2em var(--c)}
.card b{font-family:var(--f-disp);font-size:1em;line-height:1.25;text-wrap:balance}
.card span{font-size:.74em;color:#c9c3b3;line-height:1.45;text-wrap:balance}
.card.r0{--rc:rgba(236,229,212,.3);--rg:transparent}
.card.r1{--rc:#8fe6ff;--rg:rgba(143,230,255,.22)}
.card.r2{--rc:#ffc46b;--rg:rgba(255,196,107,.4)}
.card.r2::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,230,170,.22) 50%,transparent 60%);animation:shine 2.4s linear infinite;pointer-events:none}
@keyframes shine{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
.card:active{transform:scale(.97)}

.panel{width:100%;max-width:22em;display:flex;flex-direction:column;gap:.5em;text-align:left}
.mu{display:grid;grid-template-columns:1fr auto;gap:.2em .8em;align-items:center;padding:.7em .8em;border-radius:.8em;background:var(--panel);border:1px solid var(--line)}
.mu b{font-family:var(--f-disp);font-size:.95em}
.mu span{font-size:.75em;color:var(--mute);grid-column:1}
.mu button{grid-row:1/span 2;grid-column:2;border-radius:.6em;border:1px solid rgba(255,196,107,.4);background:rgba(255,196,107,.1);color:var(--lamp)!important;font-weight:700;padding:.5em .7em;font-size:.82em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mu button:disabled{opacity:.4}
.pips{display:inline-flex;gap:.2em;margin-left:.4em;vertical-align:middle}
.pips i{width:.42em;height:.42em;border-radius:50%;background:rgba(255,255,255,.15)}
.pips i.on{background:var(--lamp);box-shadow:0 0 .4em var(--lamp)}
.shard{color:var(--spirit);font-weight:700;font-variant-numeric:tabular-nums}
.lore{padding:.6em .8em;border-left:2px solid rgba(255,196,107,.5);font-family:var(--f-disp);font-size:.86em;line-height:1.6;color:#ddd6c4;background:rgba(255,255,255,.02)}
.lore.lock{border-left-color:var(--line);color:var(--mute);letter-spacing:.3em}
.lore small{display:block;font-family:var(--f-ui);font-size:.7em;color:var(--lamp);letter-spacing:.12em;margin-bottom:.1em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;width:100%;max-width:20em}
.stat div{padding:.55em .3em;border-radius:.7em;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-size:1.25em;font-variant-numeric:tabular-nums}
.stat span{font-size:.7em;color:var(--mute)}
.near{color:#ffb3ba;font-weight:600;font-size:.88em}
.gain{font-size:1.05em}
#book,#caseOv,#guide,#shop{justify-content:flex-start}
.gpage{width:100%;max-width:22em;display:flex;flex-direction:column;gap:.55em;text-align:left}
.gpage p,.gslide p{max-width:none;text-align:left}
.gi{display:grid;grid-template-columns:2.3em 1fr;gap:.75em;align-items:center;padding:.65em .75em;border-radius:.8em;background:var(--panel);border:1px solid var(--line)}
.gi i{width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:.85em;color:#0b0d16;background:radial-gradient(circle at 40% 35%,#fff,var(--c) 58%);box-shadow:0 0 .8em var(--c)}
.gi b{display:block;font-size:.92em;margin-bottom:.1em}
.gi span{display:block;font-size:.78em;color:#c9c3b3;line-height:1.5}
.dots{display:flex;gap:.45em}.dots i{width:.45em;height:.45em;border-radius:50%;background:rgba(255,255,255,.18)}.dots i.on{background:var(--lamp);box-shadow:0 0 .5em var(--lamp)}
.gnav{display:flex;gap:.5em;width:100%;max-width:22em}.gnav .btn{flex:1;min-width:0}
.sec{font-size:.72em;letter-spacing:.24em;color:var(--lamp);font-weight:600;margin-top:.5em}
.case{padding:.75em .85em;border-radius:.85em;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:.45em}
.case.solved{border-color:rgba(255,196,107,.45)}
.case.ready{border-color:#8fe6ff;box-shadow:0 0 1.2em rgba(143,230,255,.2)}
.case h3{margin:0;font-family:var(--f-disp);font-size:1em;display:flex;justify-content:space-between;gap:.5em;align-items:baseline}
.case h3 small{font-family:var(--f-ui);font-size:.7em;color:var(--mute);font-weight:500;white-space:nowrap}
.case .q{font-size:.8em;color:var(--lamp);line-height:1.5}
.case .btn{min-width:0;align-self:flex-start;padding:.55em 1em;font-size:.85em}
.clue{font-family:var(--f-disp);font-size:.82em;line-height:1.55;color:#ddd6c4;padding-left:.7em;border-left:2px solid rgba(143,230,255,.55)}
.clue.lock{color:var(--mute);border-left-color:var(--line);letter-spacing:.3em}
.choices{display:grid;gap:.4em;width:100%;max-width:22em}
.choices button{padding:.75em .9em;border-radius:.7em;border:1px solid rgba(255,196,107,.35);background:rgba(255,196,107,.07);font-weight:600;text-align:left}
.choices button:active{background:rgba(255,196,107,.2)}
.verdict{font-family:var(--f-disp);line-height:1.6}
#back{position:absolute;top:.7em;left:.7em;z-index:20;display:flex;align-items:center;gap:.25em;padding:.5em .95em .5em .6em;border-radius:999px;border:1px solid rgba(255,196,107,.55);background:rgba(12,14,26,.92);color:var(--lamp)!important;font-weight:700;font-size:.95em;box-shadow:0 .3em 1.2em rgba(0,0,0,.6),0 0 1em rgba(255,196,107,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#back svg{width:1.15em;height:1.15em}
.ov{touch-action:pan-y}
#guide{padding-top:3.6em}
#book,#caseOv,#shop{padding-top:3.8em}
#gTrack{display:flex;width:100%;max-width:23em;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;flex:none}
#gTrack::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;gap:.55em;padding:0 .3em;box-sizing:border-box;text-align:left}
.gslide h2{text-align:center;margin-bottom:.2em}
.gswipe{font-size:.72em;color:var(--mute);text-align:center;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="게임 화면"></canvas>
    <div id="ui">
      <div id="hud" hidden>
        <button class="chip pe" id="cHp" style="--c:#ffc46b" aria-label="등불 설명"><i></i><small>등불</small><span id="vHp">20</span></button>
        <div class="chip" style="--c:#ff9a4a"><i></i><small>등유</small><span id="vGold">0</span></div>
        <div class="sp"></div>
        <div class="chip" style="--c:#8fe6ff"><i></i><small>파도</small><span id="vWave">0</span></div>
      </div>
      <div id="combo"></div>
      <div id="bossbar" hidden><b id="bossName"></b><div><span id="bossFill"></span></div></div>
      <div id="story"></div>
      <div id="banner"><b></b><span></span></div>
      <div id="toast"></div>
      <div id="hint" hidden>빛나는 받침돌을 눌러<br>마을 사람을 세우세요</div>

      <div id="bar" hidden>
        <button class="ib pe" id="bSpeed" aria-label="속도">1×</button>
        <button class="ib pe" id="bPause" aria-label="일시정지"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
        <button class="ib pe" id="bSound" aria-label="소리"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8v4h3l4 3V5L6 8z" fill="currentColor"/><path id="sw" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg></button>
        <button class="ib pe" id="bBook" aria-label="등대지기 수첩"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 3.5h9a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2z"/><path d="M4 14.5a2 2 0 0 1 2-2h9"/></svg></button>

/* ---------- audio ---------- */
let AC=null,master=null,NOISE=null;const lastS={};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=meta.muted?0:.5;master.connect(AC.destination);
  NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=NOISE;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.05;src.connect(f).connect(g).connect(master);src.start();
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.12;lg.gain.value=.035;lfo.connect(lg).connect(g.gain);lfo.start();
 }catch(e){AC=null}}
function tone(f,dur,type,vol,f2,delay=0){const n=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+dur);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g).connect(master);o.start(n);o.stop(n+dur+.03)}
function noise(dur,vol,freq,type='lowpass'){const n=AC.currentTime;const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(f).connect(g).connect(master);s.start(n,Math.random());s.stop(n+dur+.05)}
function sfx(k){if(!AC||meta.muted)return;const t=performance.now();if(lastS[k]&&t-lastS[k]<55)return;lastS[k]=t;try{
 switch(k){
  case'harp':tone(900,.06,'triangle',.04,400);break;
  case'fire':noise(.25,.12,600);tone(140,.25,'sine',.08,60);break;
  case'tide':noise(.4,.06,1200,'bandpass');break;
  case'bolt':noise(.12,.1,3000,'highpass');tone(1400,.1,'square',.025,200);break;
  case'kill':tone(660+Math.random()*120,.18,'sine',.05,990);break;
  case'build':tone(330,.12,'triangle',.08);tone(495,.18,'triangle',.07,null,.08);break;
  case'hurt':noise(.4,.25,180);tone(90,.4,'sine',.18,40);break;
  case'flash':noise(.8,.2,2400,'highpass');tone(220,1,'sine',.12,880);break;
  case'wave':tone(110,1.2,'sawtooth',.04,98);tone(165,1.2,'sine',.05,147);break;
  case'up':[392,523,659,784].forEach((f,i)=>tone(f,.4,'triangle',.06,null,i*.07));noise(.6,.05,4000,'highpass');break;
  case'clue':[659,880,1175].forEach((f,i)=>tone(f,.5,'sine',.06,null,i*.1));break;
  case'card':tone(523,.12,'sine',.07);tone(784,.25,'sine',.07,null,.09);break;
  case'boss':tone(70,2,'sawtooth',.06,55);noise(1.5,.1,200);break;
  case'win':[523,659,784,1046].forEach((f,i)=>tone(f,.5,'sine',.07,null,i*.12));break;
 }}catch(e){}}

const hpMul=w=>1+(w-1)*.24+(w-1)*(w-1)*.014;

/* ---------- waves ---------- */
function genWave(w){
 const q=[],n=Math.round(6+w*1.7);const pool=[['shade',10]];
 if(w>=2)pool.push(['runner',3+w*.4]);if(w>=3)pool.push(['brute',1.2+w*.3]);if(w>=4)pool.push(['flyer',2+w*.3]);
 const tot=pool.reduce((s,p)=>s+p[1],0);const gap=Math.max(.36,1-w*.035);
 for(let i=0;i<n;i++){let r=Math.random()*tot,t='shade';for(const p of pool){r-=p[1];if(r<=0){t=p[0];break}}q.push({t,d:t==='runner'?gap*.45:t==='brute'?gap*1.4:gap})}
 if(w>=2&&nextClue())q.splice(Math.floor(n*.6),0,{t:'memory',d:gap});
 if(w%5===0)q.splice(Math.floor(n*.4),0,{t:'boss',d:2.5});
 return q;
}
function startWave(){
 wave++;queue=genWave(wave);spawnT=.6;state='wave';if(wave>=3||meta.seen.includes('aim')||towers.length)$('#hint').hidden=!(towers.length&&!meta.seen.includes('aim')&&wave<3);
 const boss=wave%5===0;
 if(boss){banner(BOSSN[wave]||'안개의 메아리','파도 '+wave+' · 거대한 그림자',true);sfx('boss')}else{banner('파도 '+wave,wave>15?'끝없는 밤':'안개가 밀려온다');sfx('wave')}
 if(wave<=15){showStory(STORY[wave-1]);if(!meta.lore.includes(wave-1)){meta.lore.push(wave-1);save()}}
}
function spawn(t,dist=0){
 const B=ET[t];const m=hpMul(wave)*(B.boss?1+Math.max(0,wave-5)*.1:1);
 const e={t,hp:B.hp*m,max:B.hp*m,x:0,y:0,dx:0,dy:1,dist,prog:dist,slow:0,slowAmt:0,wet:0,burn:0,burnDps:0,stun:0,hit:0,lit:0,alive:true,ph:Math.random()*TAU,sum:3.5};
 if(B.fly){e.sx=rnd(40,360);e.sy=-20;const ty=600;e.flen=Math.hypot(LX-e.sx,ty-e.sy);e.fd=0;e.dx=(LX-e.sx)/e.flen;e.dy=(ty-e.sy)/e.flen;e.x=e.sx;e.y=e.sy}
 else{const p=posAt(dist);e.x=p[0];e.y=p[1];e.dx=p[2];e.dy=p[3]}
 if(B.clue)discover('mem','금빛 그림자 등장 · 정화하면 단서를 남긴다. 빛줄기로 노려라');
 if(B.boss){e.name=BOSSN[wave]||'안개의 메아리';bossRef=e;$('#bossbar').hidden=false;$('#bossName').textContent=e.name}
 enemies.push(e);return e;
}
function waveClear(){

 if(mods.interest){int=Math.floor(gold*.1*mods.interest);gold+=int}

/* ---------- combat ---------- */
function tstats(t){const b=TT[t.type],L=t.lvl-1;
 return{dmg:b.dmg*(1+.7*L)*mods[t.type],range:b.range*(1+.08*L)*mods.range,rate:b.rate/mods.aspd/(1+.06*L),splash:(b.splash||0)*mods.splash*(1+.08*L),chain:(b.chain||0)+mods.chain+(L>=2?1:0),slow:Math.min(.75,(b.slow||0)+mods.slow+L*.05),burn:(b.burn||0)*(1+.5*L)*mods.burnMul}}
function findTarget(x,y,r){let best=null,bp=-1;const r2=r*r;for(const e of enemies){if(!e.alive)continue;const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<=r2&&e.prog>bp){bp=e.prog;best=e}}return best}
function damage(e,a,src,show){
 if(!e.alive)return;a*=mods.dmgAll;if(ET[e.t].armor&&src!=='burn'&&src!=='beam')a*=1-ET[e.t].armor;
 e.hp-=a;if(src!=='burn'&&src!=='beam')e.hit=.09;
 if(show)num(e.x,e.y-ET[e.t].r-4,Math.round(a),show);
 if(e.hp<=0)kill(e);
}
function kill(e){
 e.alive=false;const B=ET[e.t];kills++;
 const g=Math.round(B.gold*(1+wave*.03)*mods.gold);gold+=g;
 num(e.x,e.y-8,'+'+g,'g');
 spirits.push({x:e.x,y:e.y,life:B.boss?2.6:1.5,max:B.boss?2.6:1.5,s:B.boss?2.6:B.r/11});
 for(let i=0;i<(B.boss?60:10);i++){const a=rnd(0,TAU),v=rnd(30,B.boss?220:110);part(e.x,e.y,Math.cos(a)*v,Math.sin(a)*v,rnd(.4,.9),rnd(2,4),Math.random()<.5?SP.cyan:SP.gold,.9,-20)}
 combo++;comboT=1.8;
 if(combo>=10&&combo%10===0){const b=combo;gold+=b;toast(`연속 정화 ×${combo} · 보너스 등유 +${b}`,'gold')}
 if(e.burn>0&&mods.burnBoom){explode(e.x,e.y,48,e.max*.35+10,false);discover('boom','시너지 · 정화의 불꽃 폭발!')}
 if(B.clue||B.boss)gainClue(e.x,e.y);
 if(B.boss){bossKills++;shake=Math.max(shake,14);flashT=.35;bossRef=null;$('#bossbar').hidden=true;
  toast(`${e.name} 정화 완료`,'who');sfx('win')} else sfx('kill');
}
function explode(x,y,r,d,src='fire'){
 fx.push({k:'boom',x,y,r,life:.45,max:.45});
 for(let i=0;i<16;i++){const a=rnd(0,TAU),v=rnd(40,140);part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.3,.7),rnd(3,6),SP.ember,.88,40)}
 for(const e of enemies){if(!e.alive)continue;if((e.x-x)**2+(e.y-y)**2<=(r+ET[e.t].r)**2)damage(e,d,'fire')}
}
function hurtLighthouse(n){hp-=n;num(LX,LY-22,'-'+n+' 등불','h');if(!runSeen.has('hurt')){runSeen.add('hurt');toast('그림자가 등대에 닿아 등불이 줄었다. 등불이 약할수록 빛줄기도 짧아진다','gold')}shake=Math.max(shake,n>3?16:8);flashT=Math.max(flashT,.12);sfx('hurt');

 for(let i=0;i<14;i++)part(LX+rnd(-14,14),LY+40,rnd(-80,80),rnd(-120,-20),rnd(.4,.8),rnd(3,5),SP.red,.9,80);
 if(hp<=0){hp=0;gameOver(false)}}
function discover(k,msg){if(runSeen.has(k))return;runSeen.add(k);const first=!meta.seen.includes(k);if(first){meta.seen.push(k);save()}toast((first?'새 시너지 발견 · ':'')+msg,'syn')}
function useFlash(){

/* ---------- particles / fx ---------- */
function part(x,y,vx,vy,life,size,s,drag=.92,g=0){if(parts.length>700)parts.shift();parts.push({x,y,vx,vy,life,max:life,size,s,drag,g})}
function num(x,y,txt,kind){if(nums.length>60)nums.shift();nums.push({x:x+rnd(-4,4),y,txt,kind,life:kind==='g'?.9:.75,max:kind==='g'?.9:.75})}
function jag(pts){const o=[pts[0]];for(let i=1;i<pts.length;i++){const[a,b]=[pts[i-1],pts[i]];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;const px=-dy/l,py=dx/l;const n=Math.max(2,Math.round(l/12));for(let j=1;j<n;j++){const t=j/n,off=rnd(-7,7);o.push([a[0]+dx*t+px*off,a[1]+dy*t+py*off])}o.push(b)}return o}

/* ---------- update ---------- */
const hpR=()=>state==='title'||!maxHp?1:clamp(hp/maxHp,0,1);
function beamAngles(){const twin=mods&&mods.twin&&state!=='title';if(!twin)return[beamA];return aiming?[beamA-.15,beamA+.15]:[beamA,-Math.PI-beamA]}
function BL(){return state==='title'?320:(aiming?30:0)+190+140*hpR()}
function BH(){return aiming&&state!=='title'?.085:.11}
function update(dt){
 tm+=dt;
 {const tgt=aiming&&state!=='title'?Math.atan2(aimY-LY,aimX-LX):-Math.PI/2+Math.sin(tm*.55)*1.28;const d=Math.atan2(Math.sin(tgt-beamA),Math.cos(tgt-beamA));beamA+=d*Math.min(1,dt*(aiming?14:2.5))}
 for(const m of motes){m.p+=dt;m.x+=Math.sin(m.p*.7)*6*dt;m.y+=Math.cos(m.p*.5)*4*dt}
 for(const f of fogs){f.x+=f.vx*dt*(state==='wave'?1.6:1);if(f.x>W+130)f.x=-130;if(f.x<-130)f.x=W+130}
 if(state==='title'){updateParts(dt);return}
 if(paused||state==='over')return;
 if(state==='prep'){prepT-=dt;if(prepT<=0)startWave()}
 if(flashCd>0)flashCd-=dt;if(flashT>0)flashT-=dt;if(shake>0)shake=Math.max(0,shake-dt*40);
 if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
 if(state==='wave'){
  spawnT-=dt;if(spawnT<=0&&queue.length){const s=queue.shift();spawn(s.t);spawnT=s.d}
 }
 // enemies
 for(const e of enemies){if(!e.alive)continue;const B=ET[e.t];
  if(e.hit>0)e.hit-=dt;if(e.lit>0)e.lit-=dt;
  if(e.stun>0)e.stun-=dt;else{
   let sp=B.spd*(e.slow>0?1-e.slowAmt:1);if(e.slow>0)e.slow-=dt;
   if(B.fly){e.fd+=sp*dt;e.x=e.sx+e.dx*e.fd;e.y=e.sy+e.dy*e.fd;e.prog=e.fd/e.flen*PLEN;if(e.fd>=e.flen){e.alive=false;hurtLighthouse(B.dmg);continue}}
   else{e.dist+=sp*dt;e.prog=e.dist;if(e.dist>=PLEN){e.alive=false;if(e===bossRef){bossRef=null;$('#bossbar').hidden=true}if(B.clue)toast('단서가 안개 속으로 사라졌다','syn');hurtLighthouse(B.dmg);continue}const p=posAt(e.dist);e.x=p[0];e.y=p[1];e.dx+=(p[2]-e.dx)*Math.min(1,dt*8);e.dy+=(p[3]-e.dy)*Math.min(1,dt*8)}
  }
  if(B.clue&&Math.random()<dt*16)part(e.x+rnd(-5,5),e.y+rnd(-5,5),rnd(-10,10),rnd(-20,5),rnd(.4,.8),rnd(2,4),SP.gold,.95);
  if(e.wet>0){e.wet-=dt;if(Math.random()<dt*6)part(e.x+rnd(-6,6),e.y,0,rnd(20,40),.5,2,SP.blue,.95,60)}
  if(e.burn>0){e.burn-=dt;damage(e,e.burnDps*dt,'burn');if(Math.random()<dt*14)part(e.x+rnd(-6,6),e.y+rnd(-4,4),rnd(-8,8),rnd(-50,-25),rnd(.3,.6),rnd(2,4),SP.ember,.95,-10)}
  if(B.boss&&e.alive){e.sum-=dt;if(e.sum<=0){e.sum=4.2;for(let i=0;i<2;i++)spawn('shade',Math.max(0,e.dist-14-i*12))}}
 }
 // beams
 if(state==='wave'){const dps=9*(1+.13*(wave-1))*mods.beam*(aiming?2:1);
  for(const a of beamAngles()){for(const e of enemies){if(!e.alive)continue;const dx=e.x-LX,dy=e.y-LY,d=Math.hypot(dx,dy);if(d>BL()||d<8)continue;let df=Math.atan2(dy,dx)-a;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<BH()+ET[e.t].r/d){e.lit=.12;damage(e,dps*dt,'beam')}}}}
 // towers
 for(const t of towers){const st=tstats(t);t.cd-=dt;if(t.fl>0)t.fl-=dt;
  if(t.type==='fire'&&Math.random()<dt*10)part(t.x+rnd(-4,4),t.y-4,rnd(-6,6),rnd(-40,-20),rnd(.3,.6),rnd(2,3.5),SP.ember,.96,-10);
  if(state!=='wave')continue;
  const tg=findTarget(t.x,t.y,st.range);if(!tg)continue;
  const want=Math.atan2(tg.y-t.y,tg.x-t.x);let df=want-t.ang;df=Math.atan2(Math.sin(df),Math.cos(df));t.ang+=df*Math.min(1,dt*14);
  if(t.cd>0)continue;t.cd=st.rate;t.fl=.12;
  if(t.type==='harpoon'){const cr=Math.random()<mods.crit;projs.push({k:'harp',x:t.x,y:t.y,e:tg,tx:tg.x,ty:tg.y,dmg:st.dmg*(cr?3:1),cr});sfx('harp')}
  else if(t.type==='fire'){projs.push({k:'fire',x0:t.x,y0:t.y-8,x:t.x,y:t.y,tx:tg.x+tg.dx*ET[tg.t].spd*.3,ty:tg.y+tg.dy*ET[tg.t].spd*.3,t:0,dur:.45,dmg:st.dmg,sp:st.splash,burn:st.burn});sfx('fire')}
  else if(t.type==='tide'){fx.push({k:'ring',x:t.x,y:t.y,r0:8,r1:st.range,life:.55,max:.55,c:SP.blue,col:'120,210,255'});sfx('tide');
   for(const e of enemies){if(!e.alive)continue;if((e.x-t.x)**2+(e.y-t.y)**2<=st.range*st.range){e.slow=2;e.slowAmt=Math.max(e.slow>0?e.slowAmt:0,st.slow);e.wet=2.6+mods.wetDur;if(mods.tideStun)e.stun=Math.max(e.stun,mods.tideStun);damage(e,st.dmg,'tide')}}}
  else if(t.type==='bolt'){let cur=tg;const hit=[];const pts=[[t.x,t.y-14]];
   for(let i=0;i<st.chain&&cur;i++){hit.push(cur);pts.push([cur.x,cur.y]);let m=st.dmg*Math.pow(.85,i);let tag=false;
    if(cur.wet>0){m*=mods.wetMult;tag='w';discover('wetbolt',`젖음 + 번개 = ${mods.wetMult}배 피해!`)}
    damage(cur,m,'bolt',tag);let nb=null,nd=80*80;for(const e of enemies){if(!e.alive||hit.includes(e))continue;const d=(e.x-cur.x)**2+(e.y-cur.y)**2;if(d<nd){nd=d;nb=e}}cur=nb}
   fx.push({k:'bolt',pts:jag(pts),life:.2,max:.2});sfx('bolt')}
 }
 // projectiles
 for(const p of projs){
  if(p.k==='harp'){if(p.e.alive){p.tx=p.e.x;p.ty=p.e.y}const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),s=560*dt;p.vx=dx/d;p.vy=dy/d;
   if(d<=s+4){p.dead=true;if(p.e.alive)damage(p.e,p.dmg,'harp',p.cr?'c':false);for(let i=0;i<5;i++)part(p.tx,p.ty,rnd(-60,60),rnd(-60,60),.25,2.5,p.cr?SP.gold:SP.white,.85);if(p.cr)discover('crit','고래잡이 일격! 3배 피해')}
   else{p.x+=p.vx*s;p.y+=p.vy*s}}
  else if(p.k==='fire'){p.t+=dt/p.dur;const k=Math.min(1,p.t);p.x=p.x0+(p.tx-p.x0)*k;p.y=p.y0+(p.ty-p.y0)*k-Math.sin(k*Math.PI)*42;
   if(Math.random()<.7)part(p.x,p.y,rnd(-10,10),rnd(-10,10),.35,rnd(2,4),SP.ember,.9);
   if(p.t>=1){p.dead=true;fx.push({k:'boom',x:p.tx,y:p.ty,r:p.sp,life:.4,max:.4});shake=Math.max(shake,2);
    for(let i=0;i<12;i++){const a=rnd(0,TAU),v=rnd(30,110);part(p.tx,p.ty,Math.cos(a)*v,Math.sin(a)*v,rnd(.3,.6),rnd(3,5),SP.ember,.88,30)}
    for(const e of enemies){if(!e.alive)continue;if((e.x-p.tx)**2+(e.y-p.ty)**2<=(p.sp+ET[e.t].r)**2){e.burn=3+mods.burnDur;e.burnDps=Math.max(e.burnDps*(e.burn>0?1:0),p.burn);damage(e,p.dmg,'fire')}}}}
 }
 projs=projs.filter(p=>!p.dead);
 enemies=enemies.filter(e=>e.alive);
 for(const f of fx)f.life-=dt;fx=fx.filter(f=>f.life>0);
 for(const s of spirits){s.life-=dt;s.y-=dt*(26+s.s*10);if(Math.random()<.35)part(s.x+rnd(-5,5)*s.s,s.y,rnd(-8,8),rnd(-20,0),.6,rnd(1.5,3),SP.gold,.97)}
 spirits=spirits.filter(s=>s.life>0);
 for(const n of nums){n.life-=dt;n.y-=dt*28}nums=nums.filter(n=>n.life>0);
 updateParts(dt);
 if(state==='wave'&&!queue.length&&!enemies.length&&hp>0)waveClear();
}
function updateParts(dt){for(const p of parts){p.life-=dt;p.vx*=Math.pow(p.drag,dt*60);p.vy=p.vy*Math.pow(p.drag,dt*60)+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0)}

 c.strokeStyle='rgba(190,215,255,.16)';c.lineWidth=1.6;c.beginPath();for(let x=0;x<=W;x+=8){const isl=Math.exp(-(((x-200)/70)**2));const y=652+Math.sin(x/37)*7+isl*40;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();

 for(let i=0;i<40;i++){const a=R()*TAU,r=R()*58;c.fillStyle=`rgba(${R()<.5?'60,62,72':'20,20,26'},.6)`;c.beginPath();c.ellipse(200+Math.cos(a)*r,688+Math.sin(a)*r*.45,2+R()*5,1.5+R()*3,R()*3,0,TAU);c.fill()}

function openTower(i){selSlot=i;const t=slotT[i],b=TT[t.type],st=tstats(t);
 const extra=t.type==='fire'?` · 범위 ${Math.round(st.splash)}`:t.type==='tide'?` · 둔화 ${Math.round(st.slow*100)}%`:t.type==='bolt'?` · 연쇄 ${st.chain}`:'';
 pop.innerHTML=`<div class="pt">${FORMS[t.type][t.lvl-1]}<small style="color:var(--lamp);letter-spacing:.1em">${'★'.repeat(t.lvl)}${'☆'.repeat(4-t.lvl)}</small></div><div class="stats"><em>${b.who}</em><br>피해 ${Math.round(st.dmg*mods.dmgAll)} · 사거리 ${Math.round(st.range)} · ${(1/st.rate).toFixed(1)}회/초${extra}</div><div class="row">${t.lvl<4?`<button class="up" data-up>▲ ${FORMS[t.type][t.lvl]} · ${upCost(t)}</button>`:`<button disabled>최대 강화</button>`}<button data-sell>판매 +${Math.floor(t.spent*.7)}</button></div>`;
 placePop(t.x,t.y);refreshPop()}
function refreshPop(){if(pop.hidden)return;pop.querySelectorAll('[data-b]').forEach(b=>b.disabled=gold<TT[b.dataset.b].cost);const u=pop.querySelector('[data-up]');if(u&&selSlot>=0&&slotT[selSlot])u.disabled=gold<upCost(slotT[selSlot]);const sm=pop.querySelector('.pt small');if(sm&&!slotT[selSlot])sm.textContent='등유 '+gold}
pop.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b||b.disabled||selSlot<0)return;const i=selSlot;
 if(b.dataset.b){const k=b.dataset.b,c=TT[k].cost;if(gold<c)return;gold-=c;const[x,y]=SLOTS[i];const t={slot:i,x,y,type:k,lvl:1,cd:.3,ang:-Math.PI/2,spent:c,fl:0};towers.push(t);slotT[i]=t;
  for(let j=0;j<18;j++){const a=rnd(0,TAU),v=rnd(30,90);part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.4,.8),rnd(2,4),SP[TT[k].spr],.9)}
  fx.push({k:'ring',x,y,r0:6,r1:40,life:.4,max:.4,col:'255,220,160'});sfx('build');if(!meta.seen.includes('aim')){$('#hint').innerHTML='화면을 누른 채 끌면<br>등대 빛을 직접 비출 수 있어요';$('#hint').hidden=false}else $('#hint').hidden=true;
  if(!built.has(k)){built.add(k);toast(TT[k].quote,'who')}closePop()}
 else if(b.hasAttribute('data-up')){const t=slotT[i],c=upCost(t);if(gold<c)return;gold-=c;t.spent+=c;t.lvl++;sfx('up');fx.push({k:'ring',x:t.x,y:t.y,r0:6,r1:54,life:.5,max:.5,col:'255,210,140'});fx.push({k:'pillar',x:t.x,y:t.y,life:.9,max:.9});for(let j=0;j<16;j++)part(t.x+rnd(-10,10),t.y+rnd(-4,4),rnd(-16,16),rnd(-130,-50),rnd(.6,1.1),rnd(4,7.5),STAR,.95);num(t.x,t.y-36,FORMS[t.type][t.lvl-1],'u');shake=Math.max(shake,t.lvl>=4?7:3);if(t.lvl>=4)toast(TT[t.type].who+' 각성 · '+FORMS[t.type][3],'gold');openTower(i)}
 else if(b.hasAttribute('data-sell')){const t=slotT[i];gold+=Math.floor(t.spent*.7);towers=towers.filter(x=>x!==t);slotT[i]=null;closePop()}
});
function wpos(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/S,(ev.clientY-r.top)/S]}
cv.addEventListener('pointerdown',ev=>{
 if(state==='title'||state==='over'||paused)return;
 initAudio();if(AC&&AC.state==='suspended')AC.resume();
 const[x,y]=wpos(ev);
 let hit=-1;SLOTS.forEach((s,i)=>{if(Math.hypot(s[0]-x,s[1]-y)<24)hit=i});
 if(state!=='prep'&&state!=='wave'){closePop();return}
 if(hit>=0){if(hit===selSlot){closePop();return}slotT[hit]?openTower(hit):openBuild(hit);return}
 const hadPop=!pop.hidden;closePop();if(hadPop)return;
 aiming=true;aimX=x;aimY=y;try{cv.setPointerCapture(ev.pointerId)}catch(e){}
 if(!meta.seen.includes('aim')){meta.seen.push('aim');save();$('#hint').hidden=true;toast('빛줄기 집중 · 비추는 동안 피해 2배','syn')}
});
cv.addEventListener('pointermove',ev=>{if(aiming)[aimX,aimY]=wpos(ev)});
{const endAim=()=>{aiming=false};cv.addEventListener('pointerup',endAim);cv.addEventListener('pointercancel',endAim);cv.addEventListener('lostpointercapture',endAim)}
$('#cHp').addEventListener('click',()=>toast('등불 · 등대의 생명이자 빛줄기의 세기. 그림자가 등대에 닿으면 줄고, 0이 되면 패배','gold'));
/* cards */
function openCards(){state='cards';closePop();$('#cEy').textContent=`파도 ${wave} 막아냄`;rollCards();showOnly('cards')}
let curCards=[];
function rollCards(){
 const legend=Math.min(.22,.06+wave*.008),rare=.3;const out=[];
 for(let n=0;n<3;n++){const roll=Math.random();const want=roll<legend?2:roll<legend+rare?1:0;
  let pool=CARDS.filter(c=>c.r===want&&!out.includes(c)&&!(c.once&&taken.has(c.id)));if(!pool.length)pool=CARDS.filter(c=>!out.includes(c)&&!(c.once&&taken.has(c.id)));out.push(pool[Math.floor(Math.random()*pool.length)])}
 curCards=out;const RR=['일반','희귀','전설'];
 $('#cList').innerHTML=out.map((c,i)=>{const[col,ch]=GL[c.g];return`<button class="card r${c.r}" data-c="${i}" style="--c:${col}"><span class="rr">${RR[c.r]}</span><span class="gl">${ch}</span><b>${c.n}</b><span>${c.d}</span></button>`}).join('');
 const rb=$('#bReroll');rb.textContent=`다시 뽑기 · ${rerolls}회 남음`;rb.disabled=rerolls<=0;rb.style.opacity=rerolls>0?1:.4;
}
$('#cList').addEventListener('click',ev=>{const b=ev.target.closest('[data-c]');if(!b)return;const c=curCards[+b.dataset.c];c.a();taken.add(c.id);sfx('card');if(c.r===2)toast('전설 · '+c.n,'gold');showOnly(null);state='prep';prepT=12});
$('#bReroll').addEventListener('click',()=>{if(rerolls<=0)return;rerolls--;sfx('card');rollCards()});
$('#next').addEventListener('click',()=>{if(state!=='prep')return;const b=Math.ceil(prepT)*2;gold+=b;if(b)num(LX,LY-30,'+'+b,'g');closePop();startWave()});
$('#flash').addEventListener('click',useFlash);
$('#bSpeed').addEventListener('click',()=>{speed=speed===1?2:speed===2?3:1;$('#bSpeed').textContent=speed+'×'});
$('#bPause').addEventListener('click',()=>{if(state!=='wave'&&state!=='prep')return;paused=true;closePop();showOnly('pause')});
$('#bResume').addEventListener('click',()=>{paused=false;showOnly(null)});
$('#bQuit').addEventListener('click',()=>{paused=false;gameOver(true)});
function setMute(){$('#bSound').classList.toggle('off',meta.muted);$('#sw').style.opacity=meta.muted?.15:1;if(master)master.gain.value=meta.muted?0:.5}
$('#bSound').addEventListener('click',()=>{meta.muted=!meta.muted;save();initAudio();setMute()});
/* end of run */
function gameOver(quit){
 if(state==='over')return;const cleared=Math.max(0,wave-(state==='wave'?1:0));
 state='over';closePop();$('#bossbar').hidden=true;$('#next').hidden=true;
 const sh=cleared*2+bossKills*10+(won?30:0)+Math.floor(kills/25);
 const prevBest=meta.best;meta.shards+=sh;meta.runs++;if(cleared>meta.best)meta.best=cleared;save();
 $('#oTitle').textContent=quit?'등대를 떠났다':won?'끝없는 밤이 저물었다':'등불이 꺼졌다';
 $('#oEy').textContent=`등대 일지 · ${meta.runs}번째 밤`;
 let near='';
 if(bossRef&&bossRef.alive){near=`${bossRef.name}의 남은 기운 ${Math.max(1,Math.round(bossRef.hp/bossRef.max*100))}%. 조금만 더 버텼다면…`}
 else if(cleared>prevBest)near=`새 기록! 파도 ${cleared}까지 막아냈다`;
 else if(prevBest-cleared<=2&&prevBest>0)near=`최고 기록 파도 ${prevBest}까지 ${prevBest-cleared}파도 남았었다`;
 else if(wave<15)near=`다음 기억 조각은 파도 ${Math.min(15,wave+1)}에 있다`;
 $('#oNear').textContent=near;$('#oNear').hidden=!near;
 $('#oStat').innerHTML=`<div><b>${cleared}</b><span>막은 파도</span></div><div><b>${kills}</b><span>정화한 사람</span></div><div><b>${bossKills}</b><span>거대한 그림자</span></div>`;
 $('#oShard').textContent='+'+sh;
 setTimeout(()=>{showOnly('over');$('#hud').hidden=true;$('#bar').hidden=true},quit?0:700);
}
$('#bEndless').addEventListener('click',()=>{showOnly(null);openCards()});
$('#bRetire').addEventListener('click',()=>gameOver(false));
function toTitle(){state='title';resetWorld();mods=null;bossRef=null;$('#hud').hidden=true;$('#bar').hidden=true;$('#next').hidden=true;$('#hint').hidden=true;refreshTitle();showOnly('title')}
function refreshTitle(){const n=['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];$('#tNight').textContent=`등대 일지 · ${meta.runs<10?n[meta.runs]:(meta.runs+1)+'번째'}${meta.runs<10?' 번째':''} 밤`;$('#tShard').textContent=meta.shards;$('#tLore').textContent=`${meta.clues.length}/12${CASES.some((_,i)=>caseReady(i))?' · 추리 가능':''}`;$('#tRec').textContent=meta.best?`최고 기록 · 파도 ${meta.best}`:''}
function start(){initAudio();if(AC&&AC.state==='suspended')AC.resume();setMute();if(!meta.seen.includes('guide'))openGuide(true);else newRun()}
$('#bStart').addEventListener('click',start);$('#bAgain').addEventListener('click',start);$('#bHome').addEventListener('click',toTitle);
let shopBack='title';
function openShop(from){shopBack=from;renderShop();showOnly('shop')}
function renderShop(){$('#sShard').textContent=meta.shards;$('#sList').innerHTML=META.map(m=>{const l=meta.up[m.k],c=m.cost(l),mx=l>=m.max;return`<div class="mu"><b>${m.n}<span class="pips">${Array.from({length:m.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</span></b><span>${m.d}</span><button data-k="${m.k}" ${mx||meta.shards<c?'disabled':''}>${mx?'완료':'결정 '+c}</button></div>`}).join('')}
$('#sList').addEventListener('click',ev=>{const b=ev.target.closest('[data-k]');if(!b||b.disabled)return;const m=META.find(x=>x.k===b.dataset.k);const c=m.cost(meta.up[m.k]);if(meta.shards<c)return;meta.shards-=c;meta.up[m.k]++;save();initAudio();sfx('build');renderShop()});
$('#bShop').addEventListener('click',()=>openShop('title'));$('#bShop2').addEventListener('click',()=>openShop('over'));
$('#bShopClose').addEventListener('click',()=>{if(shopBack==='title')refreshTitle();showOnly(shopBack)});
/* clues & deduction */
const clueId=(c,k)=>c+'.'+k;
function haveCount(ci){return CASES[ci].clues.filter((_,k)=>meta.clues.includes(clueId(ci,k))).length}
function nextClue(){for(let c=0;c<CASES.length;c++)for(let k=0;k<4;k++){const id=clueId(c,k);if(!meta.clues.includes(id))return id}return null}
function caseReady(ci){return haveCount(ci)===4&&!meta.solved.includes(ci)&&!runLocked.has(ci)}
function gainClue(x,y){
 const id=nextClue();if(!id){gold+=30;num(x,y-20,'+30','g');return}
 meta.clues.push(id);save();const ci=+id.split('.')[0],n=haveCount(ci);
 toast(`단서 획득 · ${CASES[ci].t} ${n}/4${n===4?' · 추리 가능!':''}`,'syn');sfx('clue');
 fx.push({k:'page',x,y,life:1.6,max:1.6});
 for(let i=0;i<20;i++){const a=rnd(0,TAU),v=rnd(40,140);part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.5,1),rnd(4,7),STAR,.9,-10)}
}
const clueList=ci=>CASES[ci].clues.map((t,k)=>meta.clues.includes(clueId(ci,k))?`<div class="clue">${t}</div>`:`<div class="clue lock">· · ·</div>`).join('');
let caseCb=null;
function openCase(ci,cb){
 caseCb=cb;const C=CASES[ci],solved=meta.solved.includes(ci),can=caseReady(ci);
 $('#cvEy').textContent=`사건 ${ci+1} · 단서 ${haveCount(ci)}/4`;$('#cvTitle').textContent=C.t;$('#cvQ').textContent=C.q;
 $('#cvClues').innerHTML=clueList(ci);
 const ch=$('#cvChoices');ch.dataset.ci=ci;ch.innerHTML=can?C.ch.map((t,i)=>`<button data-ch="${i}">${t}</button>`).join(''):'';
 const v=$('#cvVerdict');
 if(solved){v.innerHTML=`<b style="color:var(--lamp)">해결</b><br>${C.rev}<br><small style="color:var(--mute)">보상 · ${C.reward}</small>`;v.hidden=false}
 else if(!can){v.textContent=runLocked.has(ci)?'오늘 밤은 생각이 엉켰다. 다음 밤에 다시 추리하자.':'단서를 모두 모으면 추리할 수 있다.';v.hidden=false}
 else v.hidden=true;
 const d=$('#cvDone');d.hidden=can;d.textContent='닫기';
 showOnly('caseOv');
}
$('#cvChoices').addEventListener('click',ev=>{
 const b=ev.target.closest('[data-ch]');if(!b)return;const ci=+$('#cvChoices').dataset.ci,C=CASES[ci];const ok=+b.dataset.ch===C.a;
 $('#cvChoices').innerHTML='';const v=$('#cvVerdict');
 if(ok){meta.solved.push(ci);meta.shards+=30;save();if(mods)applySolved(mods,ci);sfx('win');
  v.innerHTML=`<b style="color:var(--lamp)">추리 성공</b><br>${C.rev}<br><small style="color:var(--mute)">보상 · ${C.reward} · 빛의 결정 +30</small>`}
 else{runLocked.add(ci);sfx('hurt');v.innerHTML=`<b style="color:#ff8a96">단서와 어긋난다</b><br>단서를 다시 읽어 보자. 오늘 밤은 더 추리할 수 없다.`}
 v.hidden=false;const d=$('#cvDone');d.hidden=false;d.textContent='계속';
});
$('#cvDone').addEventListener('click',()=>{const cb=caseCb;caseCb=null;if(cb)cb();else{refreshTitle();showOnly('title')}});
let bookFromGame=false;
function openBook(fromGame){
 bookFromGame=fromGame;
 $('#bList').innerHTML='<div class="sec">사건</div>'+CASES.map((C,ci)=>{const n=haveCount(ci),sv=meta.solved.includes(ci),rd=caseReady(ci);
  return`<div class="case${sv?' solved':rd?' ready':''}"><h3>${C.t}<small>${sv?'해결 ★':n+'/4'}</small></h3><div class="q">${C.q}</div>${clueList(ci)}${rd||sv?`<button class="btn${rd?' pri':''}" data-case="${ci}">${sv?'결말 다시 보기':'추리하기'}</button>`:''}</div>`}).join('')
  +'<div class="sec">기억 조각</div>'+STORY.map((t,i)=>meta.lore.includes(i)?`<div class="lore"><small>파도 ${i+1}</small>${t}</div>`:`<div class="lore lock">· · ·</div>`).join('');
 showOnly('book');$('#book').scrollTop=0;
}
$('#bList').addEventListener('click',ev=>{const b=ev.target.closest('[data-case]');if(b)openCase(+b.dataset.case,()=>openBook(bookFromGame))});
$('#bBookClose').addEventListener('click',()=>{if(bookFromGame){paused=false;showOnly(null)}else{refreshTitle();showOnly('title')}});
$('#bLore').addEventListener('click',()=>openBook(false));
$('#bBook').addEventListener('click',()=>{if(state!=='wave'&&state!=='prep')return;paused=true;closePop();openBook(true)});
/* guide */
let gIdx=0,gStart=false;const gTrack=$('#gTrack');
function openGuide(fromStart){gStart=fromStart;gIdx=0;
 gTrack.innerHTML=GUIDE.map((g,i)=>`<section class="gslide"><h2>${g.t}</h2>${g.h}${i===0?'<div class="gswipe">옆으로 밀어서 넘기기 ›</div>':''}</section>`).join('');
 showOnly('guide');gTrack.style.scrollBehavior='auto';gTrack.scrollLeft=0;gTrack.style.scrollBehavior='';syncGuide()}
function syncGuide(){$('#gEy').textContent=`등대지기 안내서 · ${gIdx+1}/${GUIDE.length}`;$('#gDots').innerHTML=GUIDE.map((_,i)=>`<i class="${i===gIdx?'on':''}"></i>`).join('');$('#gPrev').style.visibility=gIdx?'visible':'hidden';$('#gNext').textContent=gIdx<GUIDE.length-1?'다음':gStart?'불 밝히기':'닫기'}
function goGuide(i){gIdx=clamp(i,0,GUIDE.length-1);gTrack.scrollTo({left:gIdx*gTrack.clientWidth,behavior:'smooth'});syncGuide()}
gTrack.addEventListener('scroll',()=>{const i=Math.round(gTrack.scrollLeft/Math.max(1,gTrack.clientWidth));if(i!==gIdx){gIdx=clamp(i,0,GUIDE.length-1);syncGuide()}},{passive:true});
function finishGuide(){if(!meta.seen.includes('guide')){meta.seen.push('guide');save()}if(gStart)newRun();else showOnly('title')}
$('#gPrev').addEventListener('click',()=>goGuide(gIdx-1));
$('#gNext').addEventListener('click',()=>{if(gIdx<GUIDE.length-1)goGuide(gIdx+1);else finishGuide()});
$('#bGuide').addEventListener('click',()=>openGuide(false));
$('#back').addEventListener('click',()=>{
 const vis=id=>!$('#'+id).hidden;
 if(vis('guide')){if(gIdx>0)goGuide(gIdx-1);else{refreshTitle();showOnly('title')}}
 else if(vis('caseOv'))$('#cvDone').hidden?(()=>{const cb=caseCb;caseCb=null;if(cb)cb();else{refreshTitle();showOnly('title')}})():$('#cvDone').click();
 else if(vis('book'))$('#bBookClose').click();
 else if(vis('shop'))$('#bShopClose').click();
 else if(vis('pause'))$('#bResume').click();
});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='wave'||state==='prep')&&!paused){paused=true;closePop();showOnly('pause')}});

/* ---------- boot ---------- */
function resize(){
 const cs=getComputedStyle(app);
 const aw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const ah=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 S=Math.max(.3,Math.min(aw/W,ah/H));DPR=Math.min(window.devicePixelRatio||1,2);K=S*DPR;
 const sw=Math.floor(W*S),sh=Math.floor(H*S);stage.style.width=sw+'px';stage.style.height=sh+'px';stage.style.setProperty('--u',S);
 for(const c of[cv,lcv,bgcv]){c.width=Math.round(W*K);c.height=Math.round(H*K)}
 drawBG();if(!pop.hidden)closePop();
}
window.addEventListener('resize',resize);
resize();refreshTitle();setMute();
let last=performance.now();
function loop(now){const raw=Math.min(.05,(now-last)/1000);last=now;
 const sp=(state==='wave'||state==='prep')?speed:1;const steps=sp;for(let i=0;i<steps;i++)update(raw);
 render();hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
